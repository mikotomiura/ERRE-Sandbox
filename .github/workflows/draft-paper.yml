name: Draft paper PDF

# 論文 03 を PDF に組む。**手動起動のみ** (workflow_dispatch)。
#
# **用途ごとに焼き分ける。混ぜてはいけない。**
#
# | job | 出力 artifact | テンプレート | 用途 |
# |---|---|---|---|
# | `joss`     | `paper-joss`       | Open Journals 公式 (誌面装飾つき) | **JOSS へ投稿するとき**の組版確認 |
# | `preprint` | `paper-preprint`    | 素の pandoc (装飾なし)            | **Zenodo preprint に上げる実体** |
# | `preprint` | `paper-preprint-ja` | 同上 + 日本語組版                 | 日本語版 (Zenodo 公開は当面しない) |
#
# なぜ分けるか (2026-09-12 の実地の失敗 = DA-P03M-10):
#   `openjournals-draft-action` は JOSS の誌面テンプレートを**必ず**付ける。
#   全ページに `DRAFT` 透かし / `DOI: 10.xxxxxx/draft` (placeholder) /
#   `Journal of Open Source Software, ¿VOL?(¿ISSUE?), ¿PAGE?` /
#   `Editor: Open Journals` / `Reviewers: @openjournals` /
#   `Submitted: 01 January 1970` が入る。
#   **JOSS 提出物としては正しいが、独立した preprint に載せると
#   placeholder DOI と実在しない編集情報を公開物に残すことになる。**
#   実際に 10.5281/zenodo.22719773 の初版でこれをやってしまった。
#
# なぜ preprint を matrix 1 本にしたか (2026-09-12、2 度目の失敗の後):
#   最初は en を container (`pandoc/latex`)、ja を apt で組む 2 本立てにしたが、
#   (1) container のタグを実在しない値に pin して失敗し、
#   (2) apt 側は `lmodern` 不足で失敗した。
#   **toolchain が 2 本あると、片方だけ直して drift する。**
#   日本語には CJK フォントが要り container では賄えないので、**apt 側へ寄せて 1 本にした。**
#
# なぜ手動のみか:
# - この PDF は成果物ではなく「投稿前に読むための draft」であり、毎 PR で焼く必要が無い
# - `ci.yml` の test matrix / selection には一切触らない。CI selection の
#   正典は `ci.yml` の test job であり (DA-CIS-1)、本 workflow はその外側にいる

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  joss:
    name: build paper.pdf (JOSS template)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: joss/paper.md

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-joss
          # 出力はソースと同じディレクトリに置かれる
          path: joss/paper.pdf
          if-no-files-found: error

  preprint:
    name: build ${{ matrix.out }} (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: neutral
            src: joss/paper.md
            out: paper-preprint.pdf
            artifact: paper-preprint
            # 英語版は CJK 設定を渡さない
            cjk: ""
            # 日本語が出ているかの検査は英語版では不要
            must: ""
          - label: Japanese
            src: joss/paper.ja.md
            out: paper-preprint-ja.pdf
            artifact: paper-preprint-ja
            # フォント名に空白があるので **クォートを値に含める**。
            # `${{ }}` はシェル解釈の前に展開されるため、裸だと
            # `Noto` `Serif` `CJK` `JP` が別々の引数に割れる。
            cjk: '--variable=CJKmainfont:"Noto Serif CJK JP"'
            must: "二平面 決定性 再現 限界"
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc + XeTeX + fonts
        # container を使わないのは日本語の組版に CJK フォントが要るため。
        # `lmodern` は明示指定する — `--no-install-recommends` だと
        # texlive-fonts-recommended に引きずられて入らず、pandoc の既定
        # テンプレートが `lmodern.sty` を要求して落ちる (2026-09-12 実測)。
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-latex-recommended \
            texlive-latex-extra \
            lmodern \
            fonts-noto-cjk \
            poppler-utils
          kpsewhich lmodern.sty
          fc-list :lang=ja family | head -3

      - name: Build PDF
        # --citeproc が joss/paper.bib から References を生成する
        # (bibliography: paper.bib は front matter で宣言済。
        #  相対解決のため --resource-path で joss/ を渡す)
        run: |
          set -eux
          pandoc "${{ matrix.src }}" \
            --from=markdown \
            --citeproc \
            --resource-path=joss \
            --pdf-engine=xelatex \
            --metadata link-citations=true \
            --variable=papersize:a4 \
            --variable=geometry:margin=2.5cm \
            --variable=fontsize:11pt \
            --variable=colorlinks:true \
            ${{ matrix.cjk }} \
            --output="${{ matrix.out }}"

      - name: Sanity check
        # この step が本 job の存在理由である。
        # placeholder DOI や誌名が混入した PDF を preprint として公開しないための機械検査。
        env:
          OUT: ${{ matrix.out }}
          MUST: ${{ matrix.must }}
        run: |
          set -eu
          pdftotext "$OUT" - > extracted.txt
          for bad in '10.xxxxxx' 'Journal of Open Source Software' 'Editor:' 'Reviewers:' '01 January 1970'; do
            if grep -qF "$bad" extracted.txt; then
              echo "::error::$OUT に JOSS テンプレートの痕跡が混入: $bad"
              exit 1
            fi
          done
          # 日本語版のみ: 豆腐 (□) やフォント欠落で本文が消えていないかを実測する。
          # **PDF が生成されたことは、読めることを意味しない** (DA-P03M-10 の教訓)。
          for w in $MUST; do
            if ! grep -qF "$w" extracted.txt; then
              echo "::error::$OUT に日本語が出ていない (フォント欠落の疑い): $w"
              exit 1
            fi
          done
          echo "OK: テンプレート痕跡なし${MUST:+ / 日本語の描画を確認}"

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.out }}
          if-no-files-found: error
