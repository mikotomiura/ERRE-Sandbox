name: Reproduction report
description: You ran the one-command verification. Tell us what happened — pass or fail.
title: "[repro] "
labels: ["reproduction"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for running it. **A failure is more valuable than a success** — it
        means the claim is narrower than stated, and we would rather learn that
        here than from a reviewer.

        The command, for reference (no language model, no GPU, no test framework):

        ```
        uv run --frozen --no-dev python scripts/verify_committed_artifacts.py
        ```

        What it checks, and what it deliberately does not, is in
        [REPRODUCING.md](../blob/main/REPRODUCING.md).

  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - Passed (exit code 0, full run)
        - Failed (non-zero exit code, full run)
        - Partial (ran with --only)
        - Could not get far enough to run it
    validations:
      required: true

  - type: dropdown
    id: acquired_via
    attributes:
      label: How did you get the code?
      options:
        - git clone
        - GitHub "Download ZIP"
        - Zenodo archive
        - other
    validations:
      required: true

  - type: dropdown
    id: independence
    attributes:
      label: Independence
      description: This is not about trust — it is what the report can be counted as evidence of.
      options:
        - I am not the author and followed REPRODUCING.md on my own
        - I am not the author but got help from the author along the way
        - I am the author
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: Only if the environment block is missing.
      placeholder: "e.g. Ubuntu 24.04 / Windows 11 / macOS 15 (Apple silicon)"
    validations:
      required: false

  - type: textarea
    id: output
    attributes:
      label: Output
      description: >-
        Paste the whole output, from the `=== environment (public-safe) ===`
        line to the end. That block contains no paths, usernames or
        hostnames by design — but if a traceback shows a path containing your
        username, replace it with `<REDACTED>` before pasting. If you could
        not get far enough to run the verifier, run
        `python scripts/report_environment.py` instead and paste that,
        plus where you got stuck.
      render: shell
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit you ran against
      description: "`git rev-parse --short HEAD`"
      placeholder: "e.g. dcbc50a"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Surprises, confusing steps, or documentation that did not match what you saw.
    validations:
      required: false
